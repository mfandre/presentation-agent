id: presentation-video-pydantic-ai
version: 2.5.0
description: Pydantic AI para roteiro e direção visual, com mídia no Google Vertex AI.

inputs:
  source_path:
    type: file
    required: true
  target_seconds:
    type: integer
    default: 600
  language:
    type: string
    default: pt-BR
  audience:
    type: string
    default: executive
  tone:
    type: string
    default: professional and natural
  production_mode:
    type: string
    default: hybrid_presentation

settings:
  state_backend: sqlite
  artifacts: external_storage
  authentication: google_adc

steps:
  - id: ingest
    uses: document.ingest
    outputs:
      document: presentation_document

  - id: narrative
    uses: narrative.plan
    needs: [ingest]
    config:
      provider: pydantic_ai
      model: google-cloud:gemini-3.5-flash
      location: global
      max_revisions: 3
      words_per_minute: 155
      debug:
        max_scenes: 3
    retry:
      attempts: 3
      backoff_seconds: 1

  - id: duration_validate
    uses: narrative.duration_validate
    needs: [narrative]
    config:
      words_per_minute: 155
      tolerance_percent: 5
      checkpoint_when_over_limit: true

  - id: duration_review
    uses: human.duration_approval
    needs: [duration_validate]
    checkpoint: human

  - id: speech
    uses: speech.synthesize
    needs: [duration_review]
    config:
      provider: vertex_ai
      model: gemini-3.1-flash-tts-preview
      location: global
      voice: Kore
      language_code: pt-BR
      style_prompt: Narração profissional, natural, clara e envolvente.
      max_retries: 2
      rate: 155
      timeout_seconds: 180
      debug:
        provider: espeak
        voice: pt-br
    retry:
      attempts: 3
      backoff_seconds: 2

  - id: scene_plan
    uses: scenes.plan
    needs: [narrative, speech]
    config:
      maximum_shot_seconds: 8
      timeline_source: aligned_audio
      informational_scenes:
        preserve_as_static: true
        maximum_takes: 1

  - id: visual_plan
    uses: visuals.direct
    needs: [scene_plan]
    when:
      input: production_mode
      not_equals: whiteboard_explainer
    config:
      provider: pydantic_ai
      model: google-cloud:gemini-3.5-flash
      location: global
    retry:
      attempts: 3
      backoff_seconds: 1

  - id: instructional_design
    uses: training.classify_and_direct
    needs: [visual_plan]
    when:
      input: production_mode
      equals: corporate_training
    config:
      content_types: [concept, process, rule, behavior, system_demo, recap]
      exact_information:
        rule: generated_editorial_still
        recap: generated_editorial_still
        system_demo: preserve_source_page
      generated_take_maximum_seconds: 8
      allow_generated_readable_text: false

  - id: whiteboard_concept_plan
    uses: whiteboard.concepts.plan
    needs: [scene_plan]
    when:
      input: production_mode
      equals: whiteboard_explainer
    config:
      layout_direction: left_to_right
      maximum_take_seconds: 8
      one_teaching_idea_per_take: true
      preserve_cumulative_board_state: true

  - id: prompt_compile
    uses: prompts.compile
    needs: [visual_plan, instructional_design, whiteboard_concept_plan]
    config:
      continuity: causal_state_locked
      one_exclusive_action_per_take: true
      forbid_completed_action_replay: true
      forbid_source_slides_in_cinematic_mode: true
      allow_informational_static_exception: false

  - id: rule_validate
    uses: rules.validate
    needs: [prompt_compile]
    config:
      maximum_shot_seconds: 8
      require_complete_audio_coverage: true

  - id: generate_images
    uses: assets.generate
    needs: [rule_validate]
    when:
      input: production_mode
      not_equals: whiteboard_explainer
    parallelism: 3
    config:
      provider: vertex_ai
      model: gemini-3.1-flash-image
      location: global
      aspect_ratio: "16:9"
      image_size: 2K
      timeout_seconds: 180
    retry:
      attempts: 4
      backoff_seconds: 2

  - id: whiteboard_master
    uses: whiteboard.master.generate
    needs: [rule_validate]
    when:
      input: production_mode
      equals: whiteboard_explainer
    parallelism: 3
    config:
      provider: vertex_ai
      model: gemini-3.0-pro-image-001
      location: global
      layout_direction: left_to_right
      lock_final_composition: true
      model_input:
        aspect_ratio: "16:9"
        image_size: 2K
    retry:
      attempts: 4
      backoff_seconds: 2

  - id: whiteboard_states
    uses: whiteboard.states.build
    needs: [whiteboard_master]
    when:
      input: production_mode
      equals: whiteboard_explainer
    config:
      source: locked_master
      cumulative: true
      initial_state: blank
      reveal_order: left_to_right

  - id: visual_review
    uses: human.approval
    needs: [generate_images, whiteboard_states]
    checkpoint: human

  - id: animate
    uses: videos.generate
    needs: [visual_review]
    when:
      input: production_mode
      not_equals: whiteboard_explainer
    parallelism: 2
    config:
      provider: vertex_ai
      model: veo-3.1-generate-001
      location: us-central1
      aspect_ratio: "16:9"
      resolution: 720p
      duration_seconds: 8
      poll_interval_seconds: 5
      timeout_seconds: 900
    retry:
      attempts: 3
      backoff_seconds: 2

  - id: whiteboard_animate
    uses: whiteboard.transitions.generate
    needs: [visual_review]
    when:
      input: production_mode
      equals: whiteboard_explainer
    parallelism: 1
    config:
      provider: vertex_ai
      model: veo-3.1-generate-001
      location: us-central1
      transition: previous_state_to_approved_end_state
      preserve_existing_marks: true
      natural_drawing_speed: true
      model_input:
        aspect_ratio: "16:9"
        duration: 8
        resolution: 720p
      poll_interval_seconds: 5
      timeout_seconds: 900
    retry:
      attempts: 3
      backoff_seconds: 2

  - id: visual_qa
    uses: visuals.qa
    needs: [animate, whiteboard_animate]
    config:
      verify_duration: true
      verify_non_empty_media: true
      retry_scope: shot

  - id: render
    uses: video.compose_scenes
    needs: [speech, visual_qa]
    parallelism: 2

  - id: assemble
    uses: video.compose_final
    needs: [render]

  - id: captions
    uses: captions.package
    needs: [assemble]
    config:
      formats: [webvtt, srt]
      burn_in: false
