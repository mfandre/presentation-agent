id: presentation-video-pydantic-ai
version: 2.9.0
description: Pydantic AI para roteiro e direção visual, com mídia no Google Vertex AI.

inputs:
  source_path:
    type: file
    required: true
  target_seconds:
    type: integer
    default: 600
  language:
    type: string
    default: pt-BR
  audience:
    type: string
    default: executive
  tone:
    type: string
    default: professional and natural
  production_mode:
    type: string
    default: hybrid_presentation

settings:
  state_backend: sqlite
  artifacts: external_storage
  authentication: google_adc

steps:
  - id: ingest
    uses: document.ingest
    description: Lê o documento e extrai páginas, textos, notas e imagens para as próximas etapas.
    outputs:
      document: presentation_document

  - id: content_audit
    uses: content.audit
    description: Identifica regras, prazos, números, tabelas e informações críticas que não podem ser omitidas.
    needs: [ingest]
    config:
      signals: [approval_matrix, deadlines, exact_numbers, tables]
      mandatory_priority: 4
      exact_information_requires_static_anchor: true

  - id: narrative
    uses: narrative.plan
    description: Transforma o documento em uma história coerente e escreve o texto falado de cada cena.
    needs: [ingest, content_audit]
    config:
      provider: pydantic_ai
      model: google-cloud:gemini-3.5-flash
      location: global
      max_revisions: 3
      words_per_minute: 155
      debug:
        max_scenes: 3
    retry:
      attempts: 3
      backoff_seconds: 1

  - id: content_coverage
    uses: content.coverage.validate
    description: Confere se todas as informações obrigatórias permanecem representadas no roteiro.
    needs: [narrative, content_audit]
    config:
      require_all_mandatory_information: true
      reject_page_only_coverage: true

  - id: duration_validate
    uses: narrative.duration_validate
    description: Verifica se o roteiro cabe na duração solicitada e calcula o tempo estimado.
    needs: [content_coverage]
    config:
      words_per_minute: 155
      tolerance_percent: 5
      checkpoint_when_over_limit: true

  - id: duration_review
    uses: human.duration_approval
    description: Solicita a decisão do usuário quando é necessário resumir ou aceitar uma duração maior.
    needs: [duration_validate]
    checkpoint: human

  - id: speech
    uses: speech.synthesize
    description: Gera a narração ou os diálogos e mede o áudio real para alinhar as cenas.
    needs: [duration_review]
    config:
      provider: vertex_ai
      model: gemini-3.1-flash-tts-preview
      location: global
      voice: Kore
      # Vozes atribuídas de forma determinística aos personagens no modo diálogo cinematográfico.
      dialogue_voices: [Kore, Puck, Aoede, Charon, Fenrir, Leda, Orus, Zephyr]
      language_code: pt-BR
      style_prompt: Narração profissional, natural, clara e envolvente.
      max_retries: 2
      rate: 155
      timeout_seconds: 180
      debug:
        provider: espeak
        voice: pt-br
    retry:
      attempts: 3
      backoff_seconds: 2

  - id: scene_plan
    uses: scenes.plan
    description: Divide o roteiro em cenas e takes e identifica conteúdos informativos que devem permanecer estáticos.
    needs: [narrative, speech]
    config:
      maximum_shot_seconds: 8
      timeline_source: aligned_audio
      informational_scenes:
        preserve_as_static: true
        maximum_takes: 1
        signals:
          - readable_text
          - tables
          - exact_numbers
          - deadlines
          - process_flow
          - approval_matrix

  - id: visual_plan
    uses: visuals.direct
    description: Define composição, personagens, continuidade, identidade visual e movimentos de câmera.
    needs: [scene_plan]
    when:
      input: production_mode
      not_equals: whiteboard_explainer
    config:
      provider: pydantic_ai
      model: google-cloud:gemini-3.5-flash
      location: global
    retry:
      attempts: 3
      backoff_seconds: 1

  - id: instructional_design
    uses: training.classify_and_direct
    description: Classifica cada cena de treinamento e escolhe o tratamento instrucional adequado.
    needs: [visual_plan]
    when:
      input: production_mode
      equals: corporate_training
    config:
      content_types: [concept, process, rule, behavior, system_demo, recap]
      exact_information:
        rule: generated_editorial_still
        recap: generated_editorial_still
        system_demo: preserve_source_page
      generated_take_maximum_seconds: 8
      allow_generated_readable_text: false

  - id: whiteboard_concept_plan
    uses: whiteboard.concepts.plan
    description: Organiza a explicação whiteboard em ideias didáticas cumulativas e em ordem clara de desenho.
    needs: [scene_plan]
    when:
      input: production_mode
      equals: whiteboard_explainer
    config:
      layout_direction: left_to_right
      maximum_take_seconds: 8
      one_teaching_idea_per_take: true
      preserve_cumulative_board_state: true

  - id: prompt_compile
    uses: prompts.compile
    description: Converte roteiro e direção visual em prompts completos por take, preservando continuidade.
    needs: [visual_plan, instructional_design, whiteboard_concept_plan]
    config:
      continuity: causal_state_locked
      one_exclusive_action_per_take: true
      forbid_completed_action_replay: true
      forbid_source_slides_in_cinematic_mode: true
      allow_informational_static_exception: false

  - id: rule_validate
    uses: rules.validate
    description: Valida duração, cobertura, restrições do formato e consistência antes da geração de mídia.
    needs: [prompt_compile]
    config:
      maximum_shot_seconds: 8
      require_complete_audio_coverage: true

  - id: generate_images
    uses: assets.generate
    description: Cria as imagens aprováveis de cada cena ou take usando o planejamento visual.
    needs: [rule_validate]
    when:
      input: production_mode
      not_in: [whiteboard_explainer, cinematic_story]
    parallelism: 3
    config:
      provider: vertex_ai
      model: gemini-3.1-flash-image
      location: global
      aspect_ratio: "16:9"
      image_size: 2K
      timeout_seconds: 180
    retry:
      attempts: 4
      backoff_seconds: 2

  - id: character_references
    uses: characters.reference_sheets.generate
    description: Cria referências dos personagens para preservar rosto, roupa e identidade no storyboard.
    needs: [rule_validate]
    when:
      input: production_mode
      equals: cinematic_story
    config:
      provider_config_from: generate_images
      one_sheet_per_character: true
      immutable_identity: [face, age, proportions, hair, wardrobe, colors, accessories]
      background: neutral_grey
      visible_labels: false

  - id: storyboard
    uses: storyboard.generate_and_split
    description: Gera o storyboard cinematográfico mestre e prepara seus painéis para revisão ou animação.
    needs: [character_references]
    when:
      input: production_mode
      equals: cinematic_story
    config:
      provider_config_from: generate_images
      enabled: true
      panel_seconds: 3
      panels_per_sheet: 9
      overall_aspect_ratio: "16:9"
      cell_aspect_ratio: "16:9"
      clean_machine_copy: true
      annotated_review_copy: true
      fallback: split_into_panels

  - id: whiteboard_master
    uses: whiteboard.master.generate
    description: Gera a ilustração final completa que servirá como referência imutável do whiteboard.
    needs: [rule_validate]
    when:
      input: production_mode
      equals: whiteboard_explainer
    parallelism: 3
    config:
      provider: vertex_ai
      model: gemini-3.0-pro-image-001
      location: global
      layout_direction: left_to_right
      lock_final_composition: true
      model_input:
        aspect_ratio: "16:9"
        image_size: 2K
    retry:
      attempts: 4
      backoff_seconds: 2

  - id: whiteboard_states
    uses: whiteboard.states.build
    description: Cria estados intermediários determinísticos, do quadro vazio até o desenho completo.
    needs: [whiteboard_master]
    when:
      input: production_mode
      equals: whiteboard_explainer
    config:
      source: locked_master
      cumulative: true
      initial_state: blank
      reveal_order: left_to_right
      target_take_seconds: 2
      clamp_to_model_minimum_duration: true

  - id: visual_review
    uses: human.approval
    description: Pausa o fluxo para aprovar, editar, regenerar ou substituir os visuais antes da animação.
    needs: [generate_images, storyboard, whiteboard_states]
    checkpoint: human

  - id: animate
    uses: videos.generate
    description: Anima individualmente as imagens aprovadas nos formatos com takes convencionais.
    needs: [visual_review]
    when:
      input: production_mode
      not_in: [whiteboard_explainer, cinematic_story]
    parallelism: 2
    config:
      provider: vertex_ai
      model: veo-3.1-generate-001
      location: us-central1
      aspect_ratio: "16:9"
      resolution: 720p
      duration_seconds: 8
      poll_interval_seconds: 5
      timeout_seconds: 900
    retry:
      attempts: 3
      backoff_seconds: 2

  - id: storyboard_animate
    uses: videos.storyboard.route_and_generate
    description: Envia o storyboard inteiro a modelos multi-shot ou anima seus painéis separadamente.
    needs: [visual_review]
    when:
      input: production_mode
      equals: cinematic_story
    parallelism: 1
    config:
      provider_config_from: animate
      capability_scope: model
      direct_when: [supports_storyboard_reference, supports_multishot]
      video_inputs: storyboard_only
      segment_by: [model_maximum_seconds, scene_boundary]
      fallback: animate_split_panels_with_first_last_when_supported

  - id: whiteboard_animate
    uses: whiteboard.transitions.generate
    description: Anima a transição entre estados progressivos preservando tudo que já estava desenhado.
    needs: [visual_review]
    when:
      input: production_mode
      equals: whiteboard_explainer
    parallelism: 1
    config:
      provider: vertex_ai
      model: veo-3.1-generate-001
      location: us-central1
      transition: previous_state_to_approved_end_state
      preserve_existing_marks: true
      natural_drawing_speed: true
      model_input:
        aspect_ratio: "16:9"
        duration: 4
        resolution: 720p
      poll_interval_seconds: 5
      timeout_seconds: 900
    retry:
      attempts: 3
      backoff_seconds: 2

  - id: visual_qa
    uses: visuals.qa
    description: Verifica existência, duração e integridade dos vídeos antes da composição.
    needs: [animate, storyboard_animate, whiteboard_animate]
    config:
      verify_duration: true
      verify_non_empty_media: true
      retry_scope: shot

  - id: render
    uses: video.compose_scenes
    description: Combina o visual de cada cena com áudio, duração, enquadramento e identidade visual.
    needs: [speech, visual_qa]
    parallelism: 2

  - id: assemble
    uses: video.compose_final
    description: Concatena as cenas e acrescenta abertura, encerramento e watermark configurados.
    needs: [render]

  - id: captions
    uses: captions.package
    description: Gera os arquivos de legenda VTT e SRT sincronizados com o vídeo final.
    needs: [assemble]
    config:
      formats: [webvtt, srt]
      burn_in: false
