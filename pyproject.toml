[project]
name = "presentation-video-ai"
version = "0.1.0"
description = "Generate narrated videos from PPTX and PDF files with pluggable AI, TTS, avatar, and rendering providers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pydantic-ai-slim[openai,anthropic,google]>=2.13,<3",
  "google-genai>=2.12,<3",
  "google-cloud-storage>=3,<4",
  "httpx>=0.28,<1",
  "python-pptx>=1.0,<2",
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
presentation-video = "presentation_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presentation_video"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
